# ==============================================================================
# ci.yml — Integração Contínua (CI) do Alerta Cheia Itajaí no GitHub Actions.
#
# O que é CI: a cada "git push", um computador do GitHub baixa o código,
# instala o Flutter e roda os testes. Se algo quebrar, o commit fica com um
# X vermelho e todos do grupo ficam sabendo antes de juntar no main.
#
# Arquivo em YAML: a indentação (espaços) faz parte da sintaxe — nunca use TAB.
# ==============================================================================

# Nome que aparece na aba "Actions" do repositório.
name: CI

# QUANDO rodar:
on:
  push:            # a cada push, em qualquer branch
  pull_request:    # a cada Pull Request aberto ou atualizado
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pelo botão "Run workflow"

# Cancela uma execução antiga se um novo push chegar na mesma branch
# (economiza minutos do GitHub).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1 — testes (Linux): formatação, análise estática, testes e cobertura.
  # ----------------------------------------------------------------------------
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest   # máquina virtual Linux gratuita do GitHub

    steps:
      # 1) Baixa o código do repositório para a máquina virtual.
      - name: Baixar o código
        uses: actions/checkout@v4

      # 2) Instala o Flutter na MESMA versão do PC (3.47.7) e guarda em cache.
      #    Versão fixa: uma atualização do Flutter não reprova o CI de surpresa.
      #    Para atualizar: "flutter upgrade" no PC e troque o número nos 3 jobs.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      # 3) Mostra a versão instalada (útil para depurar diferenças com o seu PC).
      - name: Versão do Flutter
        run: flutter --version

      # 4) Baixa as dependências do pubspec.yaml (equivale a "mvn dependency:resolve").
      - name: Baixar dependências
        run: flutter pub get

      # 5) Confere se o código está formatado. Se falhar, rode "dart format ." no PC.
      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed .

      # 6) Análise estática (lint): pega erros e más práticas sem executar o app.
      - name: Análise estática
        run: flutter analyze

      # 7) Roda TODOS os testes de test/ e gera o relatório coverage/lcov.info.
      - name: Rodar testes com cobertura
        run: flutter test --coverage

      # 8) Guarda o relatório de cobertura para download na página da execução.
      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-lcov
          path: coverage/lcov.info

      # 9) Exige no mínimo 80% de cobertura na LÓGICA (lib/domain e lib/data).
      #    Telas, tema e main ficam fora da conta (são cobertos por testes de widget).
      - name: Exigir 80% de cobertura na lógica
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 80
          exclude: 'lib/main.dart lib/app.dart lib/core/** lib/ui/**'

  # ----------------------------------------------------------------------------
  # JOB 2 — compila para Android (Linux). Só depois que os testes passarem.
  # ----------------------------------------------------------------------------
  build-android:
    name: Compilar Android
    needs: testes
    if: github.ref == 'refs/heads/main'   # só no main, para poupar tempo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4       # o build Android precisa do Java
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Gerar APK de debug
        run: flutter build apk --debug

  # ----------------------------------------------------------------------------
  # JOB 3 — compila para iOS (macOS). É assim que validamos iOS sem ter um Mac.
  # "--no-codesign" pula a assinatura da Apple (que exigiria conta paga).
  # Repositório PÚBLICO = minutos de macOS gratuitos.
  # ----------------------------------------------------------------------------
  build-ios:
    name: Compilar iOS
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Compilar iOS sem assinatura
        run: flutter build ios --no-codesign --debug
